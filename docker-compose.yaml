services:
  cloudflare-ip-updater:
    container_name: CloudflareIPAddressUpdater
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudflare-ip-updater:latest
    command: [
      "-zone_identifier", "${ZONE_IDENTIFIER}",
      "-auth_key", "${AUTH_KEY}",
      "-filter", "${FILTER}"
    ]
    restart: unless-stopped
